# BI 대시보드 스택 — Trino(쿼리 엔진) + Superset(BI)
#
# 아키텍처: Superset → Trino(SQL) → Glue Catalog + Iceberg → S3
#   - Spark가 write, Trino가 read (BI는 파일을 고치지 않고 SQL 질의만)
#   - Bronze/Airflow 스택과 독립 (S3/Glue만 읽음)
#
# 실행:
#   docker compose -f docker-compose.dashboard.yaml up -d
# UI:
#   Trino    → http://localhost:8086
#   Superset → http://localhost:8088  (admin/admin)
# 종료: docker compose -f docker-compose.dashboard.yaml down

name: ad-dashboard

services:
  # ════════════════════════════════════════════════════════════════════════
  # Trino — Iceberg(Glue/S3) 읽기용 분산 SQL 엔진
  # ════════════════════════════════════════════════════════════════════════
  trino:
    image: trinodb/trino:latest
    container_name: trino
    ports:
      - "8086:8080"   # Trino UI / 클라이언트 (호스트 8086)
    environment:
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # AWS SDK 기본 체인이 마운트된 ~/.aws(default 프로파일)를 읽도록 경로 지정
      AWS_SHARED_CREDENTIALS_FILE: /etc/trino/.aws/credentials
      AWS_CONFIG_FILE: /etc/trino/.aws/config
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro    # iceberg.properties
      - ${HOME}/.aws:/etc/trino/.aws:ro          # Glue/S3 자격증명
    healthcheck:
      test: ["CMD", "trino", "--execute", "SELECT 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # ════════════════════════════════════════════════════════════════════════
  # Superset 메타데이터 DB (대시보드/차트/사용자 저장)
  # ════════════════════════════════════════════════════════════════════════
  superset-db:
    image: postgres:13
    container_name: superset-db
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
      POSTGRES_DB: superset
    volumes:
      - superset-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 5s
      retries: 10

  # ════════════════════════════════════════════════════════════════════════
  # Superset — BI 대시보드 (데이터는 Trino를 통해 조회)
  # ════════════════════════════════════════════════════════════════════════
  superset:
    build:
      context: ./superset
    container_name: superset
    depends_on:
      superset-db:
        condition: service_healthy
      trino:
        condition: service_started
    environment:
      SUPERSET_METADATA_DB_URI: postgresql+psycopg2://superset:superset@superset-db/superset
    ports:
      - "8088:8088"   # Superset UI (admin/admin)
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-home:/app/superset_home
    command:
      - bash
      - -c
      - |
        superset db upgrade
        superset fab create-admin --username admin --firstname Admin --lastname User \
          --email admin@example.com --password admin || true
        superset init
        gunicorn -w 2 -t 120 -b 0.0.0.0:8088 "superset.app:create_app()"

volumes:
  superset-pgdata:
  superset-home:
