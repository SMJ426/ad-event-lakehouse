# 로컬 개발용 Kafka 환경 (KRaft 모드)
#
# 구성:
#   kafka       — Kafka 단일 브로커 (KRaft)
#   kafka-init  — 토픽 4개 생성 후 종료 (일회성)
#   producer-dummy   — dummy_producer.py 상시 실행 (실시간 이벤트 전송)
#
# 전체 파이프라인 입구를 한 번에 기동:
#   docker compose up -d
#     → kafka 기동 → (healthy) → kafka-init 토픽 생성 → (완료) → producer 시작
#
# 종료:
#   docker compose down        # 컨테이너 종료, 볼륨 유지 (메시지 보존)
#   docker compose down -v     # 컨테이너 + 볼륨 전부 삭제 (완전 초기화)
#
# 호스트에서 직접 producer를 돌리고 싶으면 (개발 중 빠른 반복):
#   docker compose up -d kafka kafka-init   # 인프라만 기동
#   cd ../code/producers && python dummy_producer.py

services:
  # ════════════════════════════════════════════════════════════════════════
  # Kafka 브로커
  # ════════════════════════════════════════════════════════════════════════
  kafka:
    image: apache/kafka:3.9.0
    # Kafka 3.7(2024-04)부터 공식 Apache 이미지 제공. Bitnami 대신 사용.
    container_name: kafka
    ports:
      - "9092:9092"   # 호스트(맥북)에서 접속하는 포트 (localhost:9092)
    environment:
      # ── KRaft 기본 설정 ────────────────────────────────────────────────
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 단일 노드가 controller(메타데이터 관리) + broker(메시지 저장) 역할을 동시 수행

      # ── Listener 설정 (접속 경로가 2개라 listener도 2개) ──────────────
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      # HOST:9092       — 호스트(맥북)의 python이 접속
      # DOCKER:29092    — 같은 Docker 네트워크의 컨테이너(producer, kafka-init)가 접속
      # CONTROLLER:9093 — KRaft 내부 Raft 합의 통신 (외부 노출 안 함)
      # ※ HOST/DOCKER/CONTROLLER는 임의로 붙인 '이름표'다. 아래 PROTOCOL_MAP에서
      #   각 이름표에 실제 보안 프로토콜을 연결한다.

      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      # 클라이언트가 최초 접속 후 "실제로 메시지를 보낼 주소"로 돌려받는 값.
      #   호스트 python    → localhost:9092 로 접속 → localhost:9092 응답 → OK
      #   컨테이너 producer → kafka:29092 로 접속    → kafka:29092 응답    → OK
      # 한 종류만 두면 다른 쪽에서 접속 실패한다. 그래서 2개가 필요하다.

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      # 각 listener 이름표 → 보안 프로토콜. 로컬이라 전부 PLAINTEXT(암호화 없음).

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # KRaft 합의에 참여하는 노드 목록 + controller가 쓸 listener 이름표.

      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # 브로커 간 통신에 쓸 listener. listener 이름을 바꾸면 기본 추론이 안 돼서 명시 필요.
      # 내부 네트워크 주소(DOCKER)를 사용. 단일 브로커라 실제 통신은 없지만 설정은 필수.

      # ── 토픽 기본값 ────────────────────────────────────────────────────
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 토픽 자동 생성 비활성화. kafka-init이 파티션/복제/보존을 명시 제어한다.

      KAFKA_LOG_RETENTION_HOURS: 720
      # 브로커 기본 보존 기간: 30일. 토픽별 retention.ms 설정이 우선 적용된다.

      # ── 단일 브로커 환경 필수 설정 ────────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 내부 토픽(__consumer_offsets, __transaction_state) 복제 인수 기본값은 3.
      # 브로커가 1개이면 "Not enough replicas" 오류 발생. EKS(브로커 3개) 전환 시 3으로.

    volumes:
      - kafka-data:/var/lib/kafka/data
      # 컨테이너를 재시작해도 메시지가 유지된다.

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ════════════════════════════════════════════════════════════════════════
  # 토픽 생성 (일회성 — 토픽 만들고 종료)
  # ════════════════════════════════════════════════════════════════════════
  kafka-init:
    image: apache/kafka:3.9.0
    # kafka-topics.sh CLI가 들어있는 동일 이미지 재사용.
    depends_on:
      kafka:
        condition: service_healthy   # Kafka가 healthy가 된 뒤에 실행
    environment:
      BOOTSTRAP: kafka:29092                          # Docker 네트워크 주소로 접속
      KAFKA_BIN: /opt/kafka/bin/kafka-topics.sh       # docker exec 없이 CLI 직접 호출
    volumes:
      - ./kafka-topics.sh:/scripts/kafka-topics.sh:ro  # 호스트 스크립트를 읽기전용 마운트
    entrypoint: ["bash", "/scripts/kafka-topics.sh"]
    # 토픽 생성이 끝나면 스크립트가 종료되고 컨테이너도 함께 종료된다 (일회성).

  # ════════════════════════════════════════════════════════════════════════
  # Producer (상시 실행 — 실시간 이벤트 전송)
  # ════════════════════════════════════════════════════════════════════════
  producer-dummy:
    build:
      context: ../code/producers      # Dockerfile 위치
    depends_on:
      kafka-init:
        condition: service_completed_successfully  # 토픽 생성 완료 후 시작
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092   # config.py가 이 값으로 오버라이드
      PYTHONUNBUFFERED: "1"                   # print 출력을 버퍼링 없이 즉시 로그로 (docker logs)
      DUMMY_MAX_AUCTIONS: "${DUMMY_MAX_AUCTIONS:-0}"   # 0=무제한, N=N건 후 종료 (적정량 수집)
    command: ["python", "dummy_producer.py"]
    restart: on-failure
    # 크래시 시에만 재시작. MAX 도달 정상 종료(code 0)면 재시작 안 함(무한 반복 방지).

  producer-criteo:
    build:
      context: ../code/producers      # producer와 동일 이미지
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PYTHONUNBUFFERED: "1"
      CRITEO_REPLAY_INTERVAL: "${CRITEO_REPLAY_INTERVAL:-0.05}"   # 행당 대기(초). 폭주 방지, 소비속도와 균형
      CRITEO_MAX_ROWS: "${CRITEO_MAX_ROWS:-0}"   # 0=무제한, N=N행 후 종료 (적정량 수집)
    command: ["python", "criteo_producer.py"]
    restart: on-failure
    # 크래시 시에만 재시작. MAX 도달 정상 종료(code 0)면 재시작 안 함(무한 반복 방지).
    # Criteo Attribution Dataset 재생. HuggingFace 스트리밍 다운로드로 초기 기동이 느릴 수 있음.

  # ════════════════════════════════════════════════════════════════════════
  # Bronze 적재 (Kafka → S3 Iceberg, Spark Structured Streaming)
  # ════════════════════════════════════════════════════════════════════════
  spark-bronze:
    build:
      context: ../code/pipelines
    user: root
    # 로컬 개발 편의: ivy 캐시 볼륨/마운트된 ~/.aws를 uid 충돌 없이 읽고 쓰기 위해 root 실행.
    depends_on:
      kafka-init:
        condition: service_completed_successfully   # 토픽이 있어야 구독 가능
    environment:
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET 미설정 — infra/.env에 S3_BUCKET=... 기록하거나 export 필요}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_SHARED_CREDENTIALS_FILE: /opt/spark/.aws/credentials   # AWS SDK v2 (Iceberg S3FileIO)
      AWS_CREDENTIAL_PROFILES_FILE: /opt/spark/.aws/credentials  # AWS SDK v1 (hadoop-aws s3a)
      AWS_CONFIG_FILE: /opt/spark/.aws/config
      MAX_OFFSETS_PER_TRIGGER: "150000"   # 배치당 15만 → 분당 15만 소비 > 유입 ~11만 → 백로그 감소
      # 적재 실패 시 잡 안에서 재시작(체크포인트 기준). 5회 소진하면 종료 → 아래 restart가 컨테이너 재기동.
      MAX_STREAM_RESTARTS: "5"
      RESTART_BACKOFF_SECONDS: "10"        # 재시작 첫 대기(초): 10→20→40→80→160
      # 5회 소진 시 알림 보낼 Slack Webhook. infra/.env에 SLACK_WEBHOOK_URL=... 기록(없으면 알림 skip).
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      APP_ENV: ${APP_ENV:-prod}   # 경보에 표기할 환경(dev/staging/prod)
    volumes:
      - ${HOME}/.aws:/opt/spark/.aws:ro          # 호스트 AWS 자격증명 (읽기전용)
      - ivy-cache:/opt/spark/.ivy2               # jar 캐시 (재다운로드 방지)
    command:
      - /opt/spark/bin/spark-submit
      - --driver-memory
      - 2g
      - --packages
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.11.0,org.apache.iceberg:iceberg-aws-bundle:1.11.0,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.hadoop:hadoop-aws:3.3.4
      - --conf
      - spark.jars.ivy=/opt/spark/.ivy2
      - /opt/spark/work-dir/bronze_stream.py
    restart: on-failure

volumes:
  kafka-data:
    driver: local
  ivy-cache:
    driver: local
