# 로컬 개발용 Kafka 환경 (KRaft 모드)
#
# 실행:
#   docker compose up -d
#   ./kafka-topics.sh   # 토픽 생성
#
# 종료:
#   docker compose down
#
# 데이터 영속화 (재시작해도 메시지 유지):
#   docker compose down        # 컨테이너만 종료, 볼륨 유지
#   docker compose down -v     # 컨테이너 + 볼륨 전부 삭제

services:
  kafka:
    image: apache/kafka:3.9.0
    # Kafka 3.7(2024-04)부터 공식 Apache 이미지 제공. Bitnami 대신 사용.
    container_name: kafka
    ports:
      - "9092:9092"   # Producer / Consumer 접속 포트 (localhost:9092)
    environment:
      # ── KRaft 기본 설정 ────────────────────────────────────────────────
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 단일 노드가 controller(메타데이터 관리) + broker(메시지 저장) 역할을 동시 수행

      # ── Listener 설정 ──────────────────────────────────────────────────
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # PLAINTEXT:9092 — 외부 Producer/Consumer 통신
      # CONTROLLER:9093 — KRaft 내부 Raft 합의 통신 (외부 노출 안 함)

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      # Producer가 "Kafka는 localhost:9092에 있다"고 인식하게 하는 주소
      # EKS 전환 시 이 값을 ELB 주소로 변경 (config.py의 KAFKA_BOOTSTRAP_SERVERS와 동일)

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # ── 토픽 기본값 ────────────────────────────────────────────────────
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 토픽을 자동 생성하지 않음. kafka-topics.sh로 명시적으로 생성한다.
      # 파티션 수, 복제 인수를 직접 제어하기 위해.

      KAFKA_LOG_RETENTION_HOURS: 720
      # 브로커 기본 보존 기간: 30일. 토픽별 retention.ms 설정이 우선 적용된다.
      # (requests/impressions=72h, clicks=14d, conversions=30d — kafka-topics.sh 참고)

      # ── 단일 브로커 환경 필수 설정 ────────────────────────────────────
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Kafka 내부 토픽(__consumer_offsets, __transaction_state)의 복제 인수 기본값은 3.
      # 브로커가 1개이면 "Not enough replicas" 오류로 기동 직후 실패한다.
      # EKS(브로커 3개)로 전환 시 이 값을 3으로 올릴 것.

    volumes:
      - kafka-data:/var/lib/kafka/data
      # 컨테이너를 재시작해도 메시지가 유지된다.

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      # Kafka가 완전히 뜰 때까지 기다린다.
      # kafka-topics.sh 실행 전에 healthy 상태인지 확인할 것.

volumes:
  kafka-data:
    driver: local
