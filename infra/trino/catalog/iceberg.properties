# Trino Iceberg 커넥터 — Glue Catalog + S3 (읽기 전용 서빙)
#
# Spark가 쓴 Iceberg 테이블(glue.{bronze,silver,gold})을 Trino가 그대로 읽는다.
# Trino 카탈로그명은 'iceberg' → 쿼리는 iceberg.gold.campaign_daily_stats 형태.
# AWS 자격증명은 컨테이너에 마운트된 ~/.aws(default 프로파일) + AWS SDK 기본 체인 사용.

connector.name=iceberg
iceberg.catalog.type=glue
hive.metastore.glue.region=ap-northeast-2

# 신형 네이티브 S3 파일시스템 (Trino 4xx+)
fs.native-s3.enabled=true
s3.region=ap-northeast-2
